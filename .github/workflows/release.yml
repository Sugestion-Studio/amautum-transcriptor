# Compila el agente para macOS (arm64 + x64), Windows y Linux y publica los
# instaladores como assets de una GitHub Release.
#
# DISPARO: versionamiento por TAG (el flujo probado). Para publicar:
#
#   1. Sube la versión en src-tauri/tauri.conf.json y src-tauri/Cargo.toml.
#   2. git commit -am "release: vX.Y.Z"
#   3. git tag vX.Y.Z && git push origin main --tags
#
#   El push del tag `v*` dispara este workflow, que compila las 4 plataformas y
#   publica la release. El build hace checkout NATIVO del tag, así que la
#   versión compilada siempre coincide con el tag (sin handoffs entre jobs).
#
# También se puede disparar a mano (workflow_dispatch) pasando la versión —
# útil para re-generar una release sin re-taggear.
#
# NOTAS devops:
#   • whisper-cli se compila in-line desde whisper.cpp (cacheado por target).
#   • Diarización (sherpa-diarize) es OPCIONAL: ver el step correspondiente.
#   • Code-signing macOS/Windows: pendiente (ver TODO en el step "Tauri build").

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. v0.1.7)."
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch_name: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_name: macos
            arch_name: x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Cache whisper.cpp build
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: whisper.cpp-build
          # v2: pickea main.exe (estáticamente enlazado) en vez de whisper-cli.exe
          # (wrapper de 28 KB) en Windows. La cache v1 no contenía nada raro,
          # pero bumpeamos para forzar un build fresco y descartar cualquier
          # artefacto cacheado problemático.
          key: whisper-${{ matrix.target }}-v2

      # TODO: si tienes whisper-cli pre-compilado en un bucket, reemplaza este
      # bloque por `curl -L https://... -o src-tauri/whisper-cli-<triple>`.
      - name: Build whisper.cpp
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper.cpp-build
          cd whisper.cpp-build
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Install whisper-cli into sidecar slot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then EXT=".exe"; fi
          # En Windows, MSVC produce whisper-cli.exe como wrapper dinámico
          # (~28 KB) que sin las DLLs adyacentes no corre. main.exe es la
          # versión histórica y la que viene estáticamente enlazada.
          # Buscamos por orden de preferencia y validamos tamaño mínimo.
          SIZE_THRESHOLD=500000  # 500 KB: cualquier binario útil pasa esto.
          SRC=""
          for candidate in \
              "whisper.cpp-build/build/bin/Release/main${EXT}" \
              "whisper.cpp-build/build/bin/main${EXT}" \
              "whisper.cpp-build/build/bin/Release/whisper-cli${EXT}" \
              "whisper.cpp-build/build/bin/whisper-cli${EXT}" \
              "whisper.cpp-build/build/main${EXT}" \
              "whisper.cpp-build/build/whisper-cli${EXT}"; do
            if [[ -f "$candidate" ]]; then
              size=$(stat -c%s "$candidate" 2>/dev/null || stat -f%z "$candidate")
              if [[ "$size" -gt "$SIZE_THRESHOLD" ]]; then
                SRC="$candidate"
                echo "Picking $SRC ($size bytes)"
                break
              else
                echo "Skipping $candidate ($size bytes — too small)"
              fi
            fi
          done
          if [[ -z "$SRC" ]]; then
            echo "ERROR: no viable whisper-cli/main binary found in build output:"
            find whisper.cpp-build/build -name "*${EXT}" -type f 2>/dev/null | xargs -I {} ls -la {} 2>/dev/null | head -30
            exit 1
          fi
          DEST="src-tauri/whisper-cli-${{ matrix.target }}${EXT}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST" || true
          dst_size=$(stat -c%s "$DEST" 2>/dev/null || stat -f%z "$DEST")
          echo "Copied $DEST ($dst_size bytes)"

      - name: Install ffmpeg sidecar (macOS)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          # Falla temprano si la descarga vino vacía (típico cuando un CDN cae)
          if [[ $(stat -f%z ffmpeg.zip 2>/dev/null || stat -c%s ffmpeg.zip) -lt 5000000 ]]; then
            echo "ERROR: ffmpeg.zip parece truncado:"
            ls -la ffmpeg.zip
            exit 1
          fi
          unzip -o ffmpeg.zip
          mv ffmpeg src-tauri/ffmpeg-${{ matrix.target }}
          chmod +x src-tauri/ffmpeg-${{ matrix.target }}

      - name: Install ffmpeg sidecar (Linux)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          # johnvansickle.com empezó a devolver 415 a clientes curl genéricos
          # en mayo 2026. Cambiamos a BtbN/FFmpeg-Builds que vive en GitHub
          # Releases — mucho más estable como dependencia de CI.
          curl -L --fail --show-error \
            -o ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          if [[ $(stat -c%s ffmpeg.tar.xz) -lt 5000000 ]]; then
            echo "ERROR: ffmpeg.tar.xz parece truncado:"
            ls -la ffmpeg.tar.xz
            exit 1
          fi
          mkdir -p ffmpeg-extract
          # BtbN trae estructura `<release>/bin/ffmpeg`; strip-components=2 nos
          # deja el binario directo en ffmpeg-extract/ffmpeg.
          tar -xf ffmpeg.tar.xz -C ffmpeg-extract
          src_bin=$(find ffmpeg-extract -name "ffmpeg" -type f -executable | head -1)
          if [[ -z "$src_bin" ]]; then
            echo "ERROR: no encontramos el binario ffmpeg dentro del tar.xz"
            find ffmpeg-extract -type f | head -30
            exit 1
          fi
          echo "Encontrado ffmpeg en: $src_bin ($(stat -c%s "$src_bin") bytes)"
          cp "$src_bin" src-tauri/ffmpeg-${{ matrix.target }}
          chmod +x src-tauri/ffmpeg-${{ matrix.target }}

      - name: Install ffmpeg sidecar (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          # `Invoke-WebRequest` no aborta en error por defecto: si gyan.dev redirige
          # raro o devuelve 4xx el script seguía y dejaba el zip vacío sin que el
          # CI lo notara. Forzamos error explícito y validamos tamaño.
          $ErrorActionPreference = "Stop"
          # Usamos curl.exe (Windows 10+ lo trae) en vez de Invoke-WebRequest:
          # más rápido con HTTP/2, sigue redirects, falla con --fail.
          curl.exe -L --fail --show-error --output ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          if (-not (Test-Path ffmpeg.zip)) { throw "ffmpeg.zip no existe tras descarga" }
          $zipSize = (Get-Item ffmpeg.zip).Length
          if ($zipSize -lt 5000000) {
            Write-Host "ffmpeg.zip pesó $zipSize bytes — descarga truncada"
            Get-ChildItem ffmpeg.zip | Format-List
            exit 1
          }
          Write-Host "Descargado ffmpeg.zip ($zipSize bytes)"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe no encontrado tras descomprimir" }
          Write-Host "ffmpeg.exe en: $($exe.FullName) ($($exe.Length) bytes)"
          New-Item -ItemType Directory -Force -Path src-tauri | Out-Null
          Copy-Item $exe.FullName "src-tauri/ffmpeg-${{ matrix.target }}.exe" -Force
          $dst = (Get-Item "src-tauri/ffmpeg-${{ matrix.target }}.exe").Length
          Write-Host "Copiado al slot sidecar ($dst bytes)"

      # ── Diarización (sherpa-onnx) — OPCIONAL, NUNCA bloquea el release ───────
      # Por defecto SHERPA_ONNX_VERSION está vacío: el release sale SIN
      # diarización. `sherpa-diarize` NO está en externalBin/capabilities del
      # repo; este step lo INYECTA solo cuando el binario se descargó bien, así
      # que un fallo de descarga jamás tumba el build — simplemente se publica
      # sin la función (el toggle de la web fallaría de forma controlada en
      # etapa `diarization`).
      #
      # Para ACTIVAR diarización: pon una versión válida de k2-fsa/sherpa-onnx
      # abajo. Usa el build ESTÁTICO del ejecutable — un build `-shared` arrastra
      # libs (.dylib/.so/.dll) que no se empaquetan en el slot sidecar (un único
      # archivo). Valida los nombres de asset contra la release.
      - name: Install sherpa-diarize sidecar (opcional)
        shell: bash
        env:
          SHERPA_ONNX_VERSION: "" # ej. "1.10.46" para activar diarización
        run: |
          set -uo pipefail
          if [[ -z "${SHERPA_ONNX_VERSION}" ]]; then
            echo "SHERPA_ONNX_VERSION vacío — este release sale SIN diarización."
            exit 0
          fi
          EXT=""
          case "${{ matrix.target }}" in
            *darwin*)  ASSET="sherpa-onnx-v${SHERPA_ONNX_VERSION}-osx-universal2-static.tar.bz2" ;;
            *linux*)   ASSET="sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-static.tar.bz2" ;;
            *windows*) ASSET="sherpa-onnx-v${SHERPA_ONNX_VERSION}-win-x64-static.tar.bz2"; EXT=".exe" ;;
            *) echo "Target no soportado: ${{ matrix.target }} — sin diarización."; exit 0 ;;
          esac
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/${ASSET}"
          echo "Descargando $URL"
          if ! curl -L --fail --show-error -o sherpa.tar.bz2 "$URL"; then
            echo "⚠ No se pudo descargar sherpa — release SIN diarización."; exit 0
          fi
          mkdir -p sherpa-extract
          if ! tar -xjf sherpa.tar.bz2 -C sherpa-extract; then
            echo "⚠ tar falló — release SIN diarización."; exit 0
          fi
          BIN=$(find sherpa-extract -type f -name "sherpa-onnx-offline-speaker-diarization${EXT}" | head -1)
          if [[ -z "$BIN" ]]; then
            echo "⚠ binario no encontrado en el tar — release SIN diarización."; exit 0
          fi
          cp "$BIN" "src-tauri/sherpa-diarize-${{ matrix.target }}${EXT}"
          chmod +x "src-tauri/sherpa-diarize-${{ matrix.target }}${EXT}" || true
          # Inyecta el sidecar en la config SOLO ahora que el binario existe.
          jq '.bundle.externalBin += ["sherpa-diarize"]' src-tauri/tauri.conf.json > _t.json && mv _t.json src-tauri/tauri.conf.json
          jq '(.permissions[] | select(.identifier? == "shell:allow-execute").allow) += [{"name":"sherpa-diarize","sidecar":true,"args":true}]' \
            src-tauri/capabilities/default.json > _c.json && mv _c.json src-tauri/capabilities/default.json
          echo "sherpa-diarize instalado e inyectado en la config."

      - name: Verify sidecar binaries before bundling
        # Aborta el build si falta un sidecar OBLIGATORIO (whisper-cli / ffmpeg).
        # `sherpa-diarize` es opcional: solo se informa, no bloquea.
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then EXT=".exe"; fi
          echo "Contenido de src-tauri/:"
          ls -la src-tauri/ || true
          missing=0
          for name in whisper-cli ffmpeg; do
            f="src-tauri/${name}-${{ matrix.target }}${EXT}"
            if [[ ! -f "$f" ]]; then
              echo "✗ FALTA: $f"
              missing=$((missing+1))
              continue
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [[ "$size" -lt 100000 ]]; then
              echo "✗ TRUNCADO: $f ($size bytes — sospechosamente pequeño)"
              missing=$((missing+1))
              continue
            fi
            echo "✓ OK $f ($size bytes)"
          done
          sf="src-tauri/sherpa-diarize-${{ matrix.target }}${EXT}"
          if [[ -f "$sf" ]]; then
            echo "✓ (opcional) sherpa-diarize presente — release CON diarización"
          else
            echo "ℹ sherpa-diarize ausente — release SIN diarización (esperado si no la activaste)"
          fi
          if [[ "$missing" -gt 0 ]]; then
            echo ""
            echo "ABORTANDO: $missing sidecar(s) obligatorio(s) faltante(s) o truncado(s)."
            exit 1
          fi

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las ACTUALIZACIONES (no del instalador). Es una llave
          # minisign propia, gratis, que no tiene nada que ver con los
          # certificados de Apple/Microsoft de más abajo.
          #
          # Con el secreto puesto, el build produce además los artefactos de
          # actualización y el `latest.json` que la app consulta: a partir de esa
          # versión, actualizar deja de ser bajar el instalador y repetir el
          # ritual de Gatekeeper/SmartScreen — la app se actualiza sola.
          #
          # SIN el secreto el build sale exactamente igual que siempre. Está
          # montado así a propósito: que falte una llave no puede tumbar un
          # release urgente.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # TODO macOS code-signing & notarization (cuando tengas los secrets):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TODO Windows code-signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          # `createUpdaterArtifacts` solo cuando hay llave: activarlo sin ella
          # aborta el build con "signing private key not set".
          args: >-
            --target ${{ matrix.target }}
            ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config {"bundle":{"createUpdaterArtifacts":true}}' || '' }}
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "Amautum Transcriptor ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: |
            Instaladores del agente Amautum Transcriptor.

            **Mac (chip Apple)** — `*-macos-arm64.dmg`
            **Mac (chip Intel)** — `*-macos-x64.dmg`
            **Windows 10/11** — `*-windows-x64.msi`
            **Linux (cualquier distro)** — `*-linux-x64.AppImage`
            **Linux (Ubuntu / Debian)** — `*-linux-x64.deb`

            Para la guía de instalación paso a paso, visita
            https://www.amautum.com/downloads/transcriptor
          # Publicación automática: la release sale publicada (no draft), así la
          # página de descargas la toma como "latest" sin intervención manual.
          releaseDraft: false
          prerelease: false

      # Renombra los artefactos de Tauri al patrón consistente
      # `AmautumTranscriptor-<version>-<os>-<arch>.<format>` que consume
      # `lib/transcriptor/agent-downloads.ts` en el frontend de Amautum.
      - name: Normalize asset names
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading v
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          DEST="release-assets"
          mkdir -p "$DEST"

          # `globstar` requeriría Bash 4+ y los runners macOS de GitHub corren
          # Bash 3.2 (limitación de la GPL). Solo `nullglob`, suficiente porque
          # no usamos `**` recursivo en este script.
          shopt -s nullglob

          # macOS DMG
          for f in "$BUNDLE_DIR"/dmg/*.dmg; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-${{ matrix.os_name }}-${{ matrix.arch_name }}.dmg"
          done

          # Windows MSI
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-windows-${{ matrix.arch_name }}.msi"
          done

          # Linux AppImage
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-linux-${{ matrix.arch_name }}.AppImage"
          done

          # Linux .deb
          for f in "$BUNDLE_DIR"/deb/*.deb; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-linux-${{ matrix.arch_name }}.deb"
          done

          ls -la "$DEST"

      - name: Upload normalized assets to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          for f in release-assets/*; do
            gh release upload "$VERSION" "$f" --clobber
          done

  # ── Changelog automático ────────────────────────────────────────────────────
  # Corre UNA vez (no por plataforma) cuando todos los builds terminaron, y
  # reescribe la descripción de la release con las MEJORAS de esta versión:
  # los commits desde el tag anterior. Así cada release documenta qué cambió sin
  # escribir nada a mano.
  release-notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generar y publicar las notas con las mejoras
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="${{ github.event.inputs.version || github.ref_name }}"

          # Tag de versión anterior (el más reciente que NO es el actual).
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          if [[ -n "$PREV" ]]; then
            RANGE="${PREV}..${TAG}"
            HEADER="### Cambios desde ${PREV}"
          else
            RANGE="$TAG"
            HEADER="### Cambios"
          fi

          # Commits del rango como viñetas, sin merges ni ruido de release/CI.
          CHANGES=$(git log --no-merges --pretty=format:'- %s' "$RANGE" \
            | grep -viE '\[skip ci\]|^- chore\(release\)' || true)
          [[ -z "$CHANGES" ]] && CHANGES="- Mejoras internas y mantenimiento."

          # Escribimos a archivo para evitar problemas de escaping con gh.
          cat > _notes.md <<EOF
          ## Novedades de ${TAG}

          ${HEADER}

          ${CHANGES}

          ---

          ### Descargas
          - **Mac (chip Apple)** — \`*-macos-arm64.dmg\`
          - **Mac (chip Intel)** — \`*-macos-x64.dmg\`
          - **Windows 10/11** — \`*-windows-x64.msi\`
          - **Linux (cualquier distro)** — \`*-linux-x64.AppImage\`
          - **Linux (Ubuntu / Debian)** — \`*-linux-x64.deb\`

          Guía de instalación paso a paso: https://www.amautum.com/downloads/transcriptor
          EOF

          echo "── Notas generadas ──"; cat _notes.md
          gh release edit "$TAG" --notes-file _notes.md
