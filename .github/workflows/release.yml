# Compila el agente para macOS (arm64 + x64), Windows y Linux y publica los
# instaladores como assets de una GitHub Release. Se dispara automáticamente al
# empujar un tag `v*` (ej. `v0.1.0`) o manualmente desde la pestaña Actions.
#
# IMPORTANTE — antes del PRIMER release necesitas resolver dos cosas en este
# workflow (marcadas como TODO):
#
#   1. Cómo conseguir el binario de `whisper-cli` para cada plataforma.
#      Hoy lo dejamos compilado in-line desde whisper.cpp (~5–10 min por SO).
#      Si tienes binarios pre-compilados en un bucket, cámbialo a `curl -L ...`.
#
#   2. Code-signing y notarización. Para macOS y Windows necesitas certificados
#      y secretos configurados en el repo (Settings → Secrets). Mientras no los
#      tengas, el instalador funciona pero el usuario verá el aviso de "app sin
#      verificar" al primer arranque.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. v0.1.0). Solo crea draft."
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch_name: arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_name: macos
            arch_name: x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch_name: x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch_name: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Cache whisper.cpp build
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: whisper.cpp-build
          # v2: pickea main.exe (estáticamente enlazado) en vez de whisper-cli.exe
          # (wrapper de 28 KB) en Windows. La cache v1 no contenía nada raro,
          # pero bumpeamos para forzar un build fresco y descartar cualquier
          # artefacto cacheado problemático.
          key: whisper-${{ matrix.target }}-v2

      # TODO: si tienes whisper-cli pre-compilado en un bucket, reemplaza este
      # bloque por `curl -L https://... -o src-tauri/whisper-cli-<triple>`.
      - name: Build whisper.cpp
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp whisper.cpp-build
          cd whisper.cpp-build
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j

      - name: Install whisper-cli into sidecar slot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then EXT=".exe"; fi
          # En Windows, MSVC produce whisper-cli.exe como wrapper dinámico
          # (~28 KB) que sin las DLLs adyacentes no corre. main.exe es la
          # versión histórica y la que viene estáticamente enlazada.
          # Buscamos por orden de preferencia y validamos tamaño mínimo.
          SIZE_THRESHOLD=500000  # 500 KB: cualquier binario útil pasa esto.
          SRC=""
          for candidate in \
              "whisper.cpp-build/build/bin/Release/main${EXT}" \
              "whisper.cpp-build/build/bin/main${EXT}" \
              "whisper.cpp-build/build/bin/Release/whisper-cli${EXT}" \
              "whisper.cpp-build/build/bin/whisper-cli${EXT}" \
              "whisper.cpp-build/build/main${EXT}" \
              "whisper.cpp-build/build/whisper-cli${EXT}"; do
            if [[ -f "$candidate" ]]; then
              size=$(stat -c%s "$candidate" 2>/dev/null || stat -f%z "$candidate")
              if [[ "$size" -gt "$SIZE_THRESHOLD" ]]; then
                SRC="$candidate"
                echo "Picking $SRC ($size bytes)"
                break
              else
                echo "Skipping $candidate ($size bytes — too small)"
              fi
            fi
          done
          if [[ -z "$SRC" ]]; then
            echo "ERROR: no viable whisper-cli/main binary found in build output:"
            find whisper.cpp-build/build -name "*${EXT}" -type f 2>/dev/null | xargs -I {} ls -la {} 2>/dev/null | head -30
            exit 1
          fi
          DEST="src-tauri/whisper-cli-${{ matrix.target }}${EXT}"
          cp "$SRC" "$DEST"
          chmod +x "$DEST" || true
          dst_size=$(stat -c%s "$DEST" 2>/dev/null || stat -f%z "$DEST")
          echo "Copied $DEST ($dst_size bytes)"

      - name: Install ffmpeg sidecar (macOS)
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          # Falla temprano si la descarga vino vacía (típico cuando un CDN cae)
          if [[ $(stat -f%z ffmpeg.zip 2>/dev/null || stat -c%s ffmpeg.zip) -lt 5000000 ]]; then
            echo "ERROR: ffmpeg.zip parece truncado:"
            ls -la ffmpeg.zip
            exit 1
          fi
          unzip -o ffmpeg.zip
          mv ffmpeg src-tauri/ffmpeg-${{ matrix.target }}
          chmod +x src-tauri/ffmpeg-${{ matrix.target }}

      - name: Install ffmpeg sidecar (Linux)
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --show-error -o ffmpeg.tar.xz "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
          if [[ $(stat -c%s ffmpeg.tar.xz) -lt 5000000 ]]; then
            echo "ERROR: ffmpeg.tar.xz parece truncado:"
            ls -la ffmpeg.tar.xz
            exit 1
          fi
          mkdir -p ffmpeg-extract
          tar -xf ffmpeg.tar.xz -C ffmpeg-extract --strip-components=1
          cp ffmpeg-extract/ffmpeg src-tauri/ffmpeg-${{ matrix.target }}
          chmod +x src-tauri/ffmpeg-${{ matrix.target }}

      - name: Install ffmpeg sidecar (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          # `Invoke-WebRequest` no aborta en error por defecto: si gyan.dev redirige
          # raro o devuelve 4xx el script seguía y dejaba el zip vacío sin que el
          # CI lo notara. Forzamos error explícito y validamos tamaño.
          $ErrorActionPreference = "Stop"
          # Usamos curl.exe (Windows 10+ lo trae) en vez de Invoke-WebRequest:
          # más rápido con HTTP/2, sigue redirects, falla con --fail.
          curl.exe -L --fail --show-error --output ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          if (-not (Test-Path ffmpeg.zip)) { throw "ffmpeg.zip no existe tras descarga" }
          $zipSize = (Get-Item ffmpeg.zip).Length
          if ($zipSize -lt 5000000) {
            Write-Host "ffmpeg.zip pesó $zipSize bytes — descarga truncada"
            Get-ChildItem ffmpeg.zip | Format-List
            exit 1
          }
          Write-Host "Descargado ffmpeg.zip ($zipSize bytes)"
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe no encontrado tras descomprimir" }
          Write-Host "ffmpeg.exe en: $($exe.FullName) ($($exe.Length) bytes)"
          New-Item -ItemType Directory -Force -Path src-tauri | Out-Null
          Copy-Item $exe.FullName "src-tauri/ffmpeg-${{ matrix.target }}.exe" -Force
          $dst = (Get-Item "src-tauri/ffmpeg-${{ matrix.target }}.exe").Length
          Write-Host "Copiado al slot sidecar ($dst bytes)"

      - name: Verify sidecar binaries before bundling
        # Aborta el build si CUALQUIER sidecar no quedó en su sitio. Sin esta
        # red de seguridad, una descarga truncada se publicaba como release y
        # el usuario chocaba en runtime con "ffmpeg: No such file or directory".
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then EXT=".exe"; fi
          echo "Contenido de src-tauri/:"
          ls -la src-tauri/ || true
          missing=0
          for name in whisper-cli ffmpeg; do
            f="src-tauri/${name}-${{ matrix.target }}${EXT}"
            if [[ ! -f "$f" ]]; then
              echo "✗ FALTA: $f"
              missing=$((missing+1))
              continue
            fi
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            if [[ "$size" -lt 100000 ]]; then
              echo "✗ TRUNCADO: $f ($size bytes — sospechosamente pequeño)"
              missing=$((missing+1))
              continue
            fi
            echo "✓ OK $f ($size bytes)"
          done
          if [[ "$missing" -gt 0 ]]; then
            echo ""
            echo "ABORTANDO: $missing sidecar(s) faltante(s) o truncado(s)."
            echo "El release NO va a salir hasta que esto se arregle."
            exit 1
          fi

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO macOS code-signing & notarization (cuando tengas los secrets):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TODO Windows code-signing:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "Amautum Transcriptor ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: |
            Instaladores firmados del agente Amautum Transcriptor.

            **Mac (chip Apple)** — `*-macos-arm64.dmg`
            **Mac (chip Intel)** — `*-macos-x64.dmg`
            **Windows 10/11** — `*-windows-x64.msi`
            **Linux (cualquier distro)** — `*-linux-x64.AppImage`
            **Linux (Ubuntu / Debian)** — `*-linux-x64.deb`

            Para la guía de instalación paso a paso, visita
            https://www.amautum.com/downloads/transcriptor
          releaseDraft: true
          prerelease: false

      # Renombra los artefactos de Tauri al patrón consistente
      # `AmautumTranscriptor-<version>-<os>-<arch>.<format>` que consume
      # `lib/transcriptor/agent-downloads.ts` en el frontend de Amautum.
      - name: Normalize asset names
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading v
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          DEST="release-assets"
          mkdir -p "$DEST"

          # `globstar` requeriría Bash 4+ y los runners macOS de GitHub corren
          # Bash 3.2 (limitación de la GPL). Solo `nullglob`, suficiente porque
          # no usamos `**` recursivo en este script.
          shopt -s nullglob

          # macOS DMG
          for f in "$BUNDLE_DIR"/dmg/*.dmg; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-${{ matrix.os_name }}-${{ matrix.arch_name }}.dmg"
          done

          # Windows MSI
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-windows-${{ matrix.arch_name }}.msi"
          done

          # Linux AppImage
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-linux-${{ matrix.arch_name }}.AppImage"
          done

          # Linux .deb
          for f in "$BUNDLE_DIR"/deb/*.deb; do
            cp "$f" "$DEST/AmautumTranscriptor-$VERSION-linux-${{ matrix.arch_name }}.deb"
          done

          ls -la "$DEST"

      - name: Upload normalized assets to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          for f in release-assets/*; do
            gh release upload "$VERSION" "$f" --clobber
          done
